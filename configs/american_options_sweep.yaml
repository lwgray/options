method: grid
metric:
  goal: minimize
  name: eval/mean_relative_l1_error
name: american_options_lr_sweep
parameters:
  batch_size:
    values:
    - 16
    - 32
  dataset:
    value: american_options
  early_stopping_patience:
    value: 5
  early_stopping_threshold:
    value: 0.05
  lr:
    values:
    - 1.0e-05
    - 2.0e-05
    - 5.0e-05
  lr_embedding_recovery:
    values:
    - 0.0005
    - 0.001
    - 0.002
  lr_scheduler:
    value: cosine
  lr_time_embedding:
    values:
    - 0.0005
    - 0.0008
    - 0.001
  model_name:
    value: B
  num_epochs:
    value: 50
  warmup_ratio:
    values:
    - 0.0
    - 0.05
    - 0.1
  weight_decay:
    value: 1.0e-06
